<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" aria-hidden="true">
  <defs>
    <!-- Path for the curved #OPENTOWORK text -->
    <path id="opentowork-arc-path" d="M 12 75.5 A 50.5 50.5 0 0 0 108 75.5" fill="none" />
  </defs>

  <!-- Complete circular outer ring -->
  <circle cx="60" cy="60" r="56.5" fill="none" stroke="#0a8754" stroke-width="2.5" />

  <!-- Background curved green banner -->
  <path
    d="M 9.5 74 A 52.5 52.5 0 0 0 110.5 74"
    fill="none"
    stroke="#057642"
    stroke-width="15.5"
    stroke-linecap="round"
  />
  <path
    d="M 10 74 A 52.5 52.5 0 0 0 110 74"
    fill="none"
    stroke="#0a8754"
    stroke-width="13"
    stroke-linecap="round"
  />

  <!-- Curved white text -->
  <text
    fill="#ffffff"
    font-size="7.6"
    font-weight="800"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    letter-spacing="0.12em"
  >
    <textPath href="#opentowork-arc-path" startOffset="50%" text-anchor="middle">
      #OPEN TO WORK
    </textPath>
  </text>
</svg>
