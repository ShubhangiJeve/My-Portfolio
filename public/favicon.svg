<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="fav-grad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="core-grad" x1="12" y1="12" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Dark background rounded tile -->
  <rect width="32" height="32" rx="8" fill="#0b0f19" />
  <rect width="32" height="32" rx="8" stroke="url(#fav-grad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Outer constellation / circuit nodes -->
  <line x1="16" y1="5" x2="16" y2="9" stroke="url(#fav-grad)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="16" y1="23" x2="16" y2="27" stroke="url(#fav-grad)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="5" y1="16" x2="9" y2="16" stroke="url(#fav-grad)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="23" y1="16" x2="27" y2="16" stroke="url(#fav-grad)" stroke-width="1.8" stroke-linecap="round" />

  <line x1="8.2" y1="8.2" x2="11.2" y2="11.2" stroke="url(#fav-grad)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="20.8" y1="20.8" x2="23.8" y2="23.8" stroke="url(#fav-grad)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="8.2" y1="23.8" x2="11.2" y2="20.8" stroke="url(#fav-grad)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="20.8" y1="11.2" x2="23.8" y2="8.2" stroke="url(#fav-grad)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Center Glowing AI Neural Core -->
  <circle cx="16" cy="16" r="4.5" fill="url(#core-grad)" />
  <circle cx="16" cy="16" r="2" fill="#ffffff" />
</svg>